<!doctype html>
<html>
<head>
    <title>Products</title>
</head>
<body>

<h1>Products</h1>

{% if error %}
    <p style="color:red">{{ error }}</p>
{% endif %}

{% if products %}
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Category</th>
            <th>Price</th>
        </tr>

        {% for p in products %}
        <tr>
            <td>{{ p.id }}</td>
            <td>{{ p.name }}</td>
            <td>{{ p.category }}</td>
            <td>{{ p.price }}</td>
        </tr>
        {% endfor %}

    </table>
{% endif %}

</body>
</html>
